<!DOCTYPE html>
<html>
<head>
    <title>Debug Echoes of Athens</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
        .info { color: #4444ff; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Echoes of Athens - Diagnostics</h1>
    <div id="output"></div>
    
    <script>
        const log = (msg, type = 'info') => {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toISOString()}] ${msg}`;
            document.getElementById('output').appendChild(div);
        };
        
        log('Starting diagnostics...', 'info');
        
        // Test 1: Check if Leaflet loads
        const leafletScript = document.createElement('script');
        leafletScript.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        leafletScript.onload = () => {
            log('✓ Leaflet loaded successfully', 'success');
            log(`Leaflet version: ${L.version}`, 'info');
            
            // Test 2: Try to load app.js
            fetch('https://echoes-of-athens.vercel.app/app.js')
                .then(r => r.text())
                .then(code => {
                    log(`✓ app.js fetched (${code.length} bytes)`, 'success');
                    
                    // Check if POIs array exists
                    if (code.includes('const POIs')) {
                        log('✓ POIs array found in code', 'success');
                    } else {
                        log('✗ POIs array NOT found', 'error');
                    }
                    
                    // Check for common errors
                    if (code.includes('const POIs = [')) {
                        const match = code.match(/const POIs = \[([\s\S]*?)\];/);
                        if (match) {
                            log('✓ POIs array structure looks valid', 'success');
                        }
                    }
                    
                    // Try to execute initialization
                    log('Attempting to load app.js...', 'info');
                    const script = document.createElement('script');
                    script.src = 'https://echoes-of-athens.vercel.app/app.js';
                    script.onerror = (e) => {
                        log(`✗ Error loading app.js: ${e}`, 'error');
                    };
                    script.onload = () => {
                        log('✓ app.js loaded', 'success');
                        
                        // Check if variables are defined
                        setTimeout(() => {
                            log(`typeof POIs: ${typeof POIs}`, 'info');
                            log(`typeof initMap: ${typeof initMap}`, 'info');
                            log(`typeof L: ${typeof L}`, 'info');
                            
                            if (typeof POIs !== 'undefined') {
                                log(`✓ POIs array is accessible (${POIs.length} items)`, 'success');
                            } else {
                                log('✗ POIs array is NOT accessible', 'error');
                            }
                        }, 1000);
                    };
                    document.head.appendChild(script);
                })
                .catch(err => {
                    log(`✗ Error fetching app.js: ${err}`, 'error');
                });
        };
        leafletScript.onerror = () => {
            log('✗ Leaflet failed to load', 'error');
        };
        document.head.appendChild(leafletScript);
        
        // Check console errors
        window.onerror = function(msg, url, line, col, error) {
            log(`✗ JavaScript Error: ${msg} at ${url}:${line}:${col}`, 'error');
            return false;
        };
    </script>
</body>
</html>
